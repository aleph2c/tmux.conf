# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Dracula theme
set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Vancouver"
set -g @dracula-show-fahrenheit false
set -g @dracula-plugins "cpu-usage ram-usage weather"
set -g @dracula-show-flags true
set -g @dracula-left-icon-padding 0
set -g @dracula-show-left-icon window

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set-option -sa terminal-features ',alacritty:RGB'
set-option -g focus-events on

# General settings
set -s escape-time 1
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 4096
set-option -g default-shell "/bin/bash"

# Mouse
set -g mouse on
bind m set -g mouse on \; display 'Mouse mode on'
bind M set -g mouse off \; display 'Mouse mode off'

# Sync tmux mouse selection to X11 PRIMARY so external tools (e.g. TTS hotkey) can read it
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection primary"
bind -T root MouseDragEnd1Pane send -X copy-pipe "xclip -in -selection primary"

# Vi copy mode
setw -g mode-keys vi
unbind p
bind p paste-buffer

# Splits
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar
set -g status-fg white
set -g status-bg colour234
set -g status-left-length 32
set -g status-right-length 150

# Window styles
set-window-option -g window-status-current-style fg=colour166,bg=default,bright
setw -g monitor-activity on
set -g visual-activity on

# Pane borders
set-option -g pane-border-style fg=colour235
set-option -g pane-active-border-style fg=colour240

# URL view
bind-key u capture-pane \; save-buffer /tmp/tmux-buffer \; run-shell "$TERMINAL -e urlview /tmp/tmux-buffer"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
